<svg xmlns="http://www.w3.org/2000/svg" width="680" height="346" viewBox="0 0 1100 560">
  <rect width="1100" height="560" fill="#f7f9fc"/>
  <text x="45" y="45" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#12243d">用户不离开 PowerPoint 的整套制作旅程</text>
  <g font-family="Noto Sans CJK SC, sans-serif" font-size="15">
    <text x="45" y="110" fill="#607286" font-weight="700">用户 / Taskpane</text>
    <text x="45" y="255" fill="#607286" font-weight="700">Agent / PC</text>
    <text x="45" y="400" fill="#607286" font-weight="700">PowerPoint 文档</text>
  </g>
  <line x1="180" y1="83" x2="180" y2="500" stroke="#c7d2df" stroke-width="2"/>
  <g font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <g><circle cx="250" cy="105" r="28" fill="#2f80a8"/><text x="250" y="112" font-size="19" fill="#fff">1</text><text x="250" y="155" font-size="15" fill="#173b55">提出目标/上传资料</text></g>
    <g><circle cx="410" cy="105" r="28" fill="#2f80a8"/><text x="410" y="112" font-size="19" fill="#fff">2</text><text x="410" y="155" font-size="15" fill="#173b55">审阅故事线</text></g>
    <g><circle cx="570" cy="105" r="28" fill="#2f80a8"/><text x="570" y="112" font-size="19" fill="#fff">3</text><text x="570" y="155" font-size="15" fill="#173b55">确定样式契约</text></g>
    <g><circle cx="730" cy="105" r="28" fill="#2f80a8"/><text x="730" y="112" font-size="19" fill="#fff">4</text><text x="730" y="155" font-size="15" fill="#173b55">观察逐页进度</text></g>
    <g><circle cx="890" cy="105" r="28" fill="#2f80a8"/><text x="890" y="112" font-size="19" fill="#fff">5</text><text x="890" y="155" font-size="15" fill="#173b55">审阅/继续修改</text></g>
  </g>
  <g fill="#dff1e6" stroke="#4c9b68" stroke-width="2" font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <rect x="195" y="215" width="110" height="68" rx="12"/><text x="250" y="244" font-size="15" fill="#245a38">解析附件</text><text x="250" y="267" font-size="13" fill="#245a38">建立 Brief</text>
    <rect x="355" y="215" width="110" height="68" rx="12"/><text x="410" y="244" font-size="15" fill="#245a38">研究与规划</text><text x="410" y="267" font-size="13" fill="#245a38">SlideTask</text>
    <rect x="515" y="215" width="110" height="68" rx="12"/><text x="570" y="244" font-size="15" fill="#245a38">锁定样式</text><text x="570" y="267" font-size="13" fill="#245a38">准备资产</text>
    <rect x="675" y="215" width="110" height="68" rx="12"/><text x="730" y="244" font-size="15" fill="#245a38">编译与写入</text><text x="730" y="267" font-size="13" fill="#245a38">页面回执</text>
    <rect x="835" y="215" width="110" height="68" rx="12"/><text x="890" y="244" font-size="15" fill="#245a38">分层验收</text><text x="890" y="267" font-size="13" fill="#245a38">交付摘要</text>
  </g>
  <g fill="#fff" stroke="#758ca2" stroke-width="2" font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <rect x="195" y="365" width="110" height="70" rx="8"/><text x="250" y="396" font-size="15" fill="#34495e">读取主题</text><text x="250" y="420" font-size="13" fill="#607286">建立基线</text>
    <rect x="355" y="365" width="110" height="70" rx="8"/><text x="410" y="396" font-size="15" fill="#34495e">创建页任务</text><text x="410" y="420" font-size="13" fill="#607286">暂不伪装完成</text>
    <rect x="515" y="365" width="110" height="70" rx="8"/><text x="570" y="396" font-size="15" fill="#34495e">真实页预览</text><text x="570" y="420" font-size="13" fill="#607286">持续观察纠偏</text>
    <rect x="675" y="365" width="110" height="70" rx="8"/><text x="730" y="396" font-size="15" fill="#34495e">原生对象</text><text x="730" y="420" font-size="13" fill="#607286">写后回读</text>
    <rect x="835" y="365" width="110" height="70" rx="8"/><text x="890" y="396" font-size="15" fill="#34495e">可编辑成品</text><text x="890" y="420" font-size="13" fill="#607286">保存点/撤销</text>
  </g>
  <g stroke="#8ba1b5" stroke-width="3" fill="none"><path d="M278 105H382"/><path d="M438 105H542"/><path d="M598 105H702"/><path d="M758 105H862"/></g>
  <g fill="#8ba1b5"><polygon points="377,98 391,105 377,112"/><polygon points="537,98 551,105 537,112"/><polygon points="697,98 711,105 697,112"/><polygon points="857,98 871,105 857,112"/></g>
  <text x="550" y="510" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#526679">用户只在高影响节点做判断；研究、素材、重试、回读和普通页面生产由 Agent 自动完成。</text>
</svg>
