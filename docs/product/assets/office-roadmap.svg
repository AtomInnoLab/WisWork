<svg xmlns="http://www.w3.org/2000/svg" width="680" height="316" viewBox="0 0 1120 520">
  <rect width="1120" height="520" fill="#f7f9fc"/>
  <text x="45" y="45" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#12243d">Office 插件专项 O0-O6：先可靠，再高质量，最后规模化</text>
  <line x1="85" y1="245" x2="1040" y2="245" stroke="#9bafc0" stroke-width="5"/>
  <g font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <g><circle cx="110" cy="245" r="29" fill="#2f80a8"/><text x="110" y="252" font-size="18" fill="#fff">O0</text><text x="110" y="320" font-size="16" font-weight="700" fill="#173b55">多文档会话</text><text x="110" y="344" font-size="13" fill="#526679">配对·隔离·重连</text></g>
    <g><circle cx="260" cy="245" r="29" fill="#2f80a8"/><text x="260" y="252" font-size="18" fill="#fff">O1</text><text x="260" y="165" font-size="16" font-weight="700" fill="#173b55">Taskpane 项目化</text><text x="260" y="189" font-size="13" fill="#526679">ACP 时间线</text></g>
    <g><circle cx="410" cy="245" r="29" fill="#2f80a8"/><text x="410" y="252" font-size="18" fill="#fff">O2</text><text x="410" y="320" font-size="16" font-weight="700" fill="#173b55">附件与资产</text><text x="410" y="344" font-size="13" fill="#526679">PDF·图片·分片</text></g>
    <g><circle cx="560" cy="245" r="29" fill="#2f80a8"/><text x="560" y="252" font-size="18" fill="#fff">O3</text><text x="560" y="165" font-size="16" font-weight="700" fill="#173b55">事务化写入</text><text x="560" y="189" font-size="13" fill="#526679">SlideIR·回读</text></g>
    <g><circle cx="710" cy="245" r="29" fill="#d56b2d"/><text x="710" y="252" font-size="18" fill="#fff">O4</text><text x="710" y="320" font-size="16" font-weight="700" fill="#7a3d1b">截图与审查</text><text x="710" y="344" font-size="13" fill="#6f523f">页面级修复闭环</text></g>
    <g><circle cx="860" cy="245" r="29" fill="#d56b2d"/><text x="860" y="252" font-size="18" fill="#fff">O5</text><text x="860" y="165" font-size="16" font-weight="700" fill="#7a3d1b">现稿修改</text><text x="860" y="189" font-size="13" fill="#6f523f">差异·撤销</text></g>
    <g><circle cx="1010" cy="245" r="29" fill="#3d8e5b"/><text x="1010" y="252" font-size="18" fill="#fff">O6</text><text x="1010" y="320" font-size="16" font-weight="700" fill="#205b39">发布与兼容</text><text x="1010" y="344" font-size="13" fill="#416650">灰度·回滚·冒烟</text></g>
  </g>
  <rect x="75" y="400" width="650" height="45" rx="22" fill="#dcebf5"/>
  <text x="400" y="428" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#1d5578">P0：在插件内稳定完成一次整套 PPT（O0-O4）</text>
  <rect x="740" y="400" width="245" height="45" rx="22" fill="#fde8da"/>
  <text x="862" y="428" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#8b431d">P1：安全修改现稿（O5）</text>
  <rect x="990" y="400" width="90" height="45" rx="22" fill="#dff1e6"/>
  <text x="1035" y="428" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#205b39">P2</text>
  <text x="560" y="485" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#526679">每阶段必须提供验收证据、部署矩阵、兼容范围和回滚方式，满足入口条件后才能进入下一阶段。</text>
</svg>
