# License gate for the standalone Office relay. Every dependency must offer
# at least one license from this explicit allowlist; cargo-deny selects a
# permitted branch of SPDX `OR` expressions.
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Unlicense",
  "BSL-1.0",
]
