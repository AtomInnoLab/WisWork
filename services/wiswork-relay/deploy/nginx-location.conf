# Define once in the nginx `http` block:
# limit_req_zone $binary_remote_addr zone=wiswork_relay_upgrade:10m rate=10r/m;
# limit_conn_zone $binary_remote_addr zone=wiswork_relay_connections:10m;
# Include the locations below inside the Office TLS server block.
location = /office-relay {
    limit_req zone=wiswork_relay_upgrade burst=5 nodelay;
    limit_conn wiswork_relay_connections 8;
    proxy_pass http://127.0.0.1:43190;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
}

location = /office-relay/health {
    proxy_pass http://127.0.0.1:43190;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    access_log off;
}
