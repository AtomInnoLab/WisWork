server {
    server_name office.8-216-134-194.sslip.io;

    root /var/www/wiswork-office-addin;
    index taskpane.html;

    include /opt/wiswork-relay/nginx-location.conf;

    location = /oauth/callback {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        default_type text/html;
        try_files /oauth/callback =404;
    }

    location = /oauth/dialog-start.html {
        add_header Cache-Control "no-store" always;
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        try_files $uri =404;
    }

    location = /taskpane.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/office.8-216-134-194.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office.8-216-134-194.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name office.8-216-134-194.sslip.io;
    return 301 https://$host$request_uri;
}
